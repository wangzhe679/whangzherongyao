name: Release Linux Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Linux amd64 Docker archive
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build clang libclang-dev \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libnm-dev \
            xdg-utils file curl wget

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ubuntu-22.04-x64-release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Linux release binary and Web UI
        env:
          ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_ID }}
          ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
        run: |
          test -n "$ANTIGRAVITY_OAUTH_CLIENT_ID" && test -n "$ANTIGRAVITY_OAUTH_CLIENT_SECRET" || { echo "Required OAuth build secrets are not configured"; exit 1; }
          npm run tauri build -- --no-bundle --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build and verify Docker image, then export docker-load archive
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v$(node -p "require('./package.json').version")-docker-$GITHUB_RUN_NUMBER"
          fi
          image="antigravity-manager:$version"
          archive="antigravity-manager-$version.tar.gz"
          mkdir -p image-context packages
          cp src-tauri/target/release/antigravity-tools image-context/
          cp -r dist image-context/dist
          docker build --platform linux/amd64 -f docker/Dockerfile.release -t "$image" image-context
          docker run --rm --entrypoint /bin/sh "$image" -ec '
            test -x /app/antigravity-tools
            test -s /app/dist/index.html
            ldd /app/antigravity-tools > /tmp/libraries
            cat /tmp/libraries
            ! grep -q "not found" /tmp/libraries
          '
          test_name="antigravity-build-check-$GITHUB_RUN_ID"
          trap 'docker rm -f "$test_name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$test_name" -p 127.0.0.1:18045:8045 \
            -e ABV_API_KEY=ci-image-smoke-test -e ABV_WEB_PASSWORD=ci-image-smoke-test "$image"
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:18045/health >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then docker logs --tail 100 "$test_name"; exit 1; fi
          curl -fsS --max-time 10 http://127.0.0.1:18045/ -o /tmp/antigravity-index.html
          grep -qi '<html' /tmp/antigravity-index.html
          docker save "$image" | gzip -1 > "packages/$archive"
          gzip -t "packages/$archive"
          docker load -i "packages/$archive"
          docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}' | grep -qx 'linux/amd64'
          (cd packages && sha256sum "$archive" > SHA256SUMS.txt)
          {
            echo '## Docker image download (Linux amd64)'
            echo "Image: $image"
            echo "Import: docker load -i $archive"
            echo 'The archive contains a Docker image, including the runtime dependencies, binary and Web UI.'
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload downloadable Docker image
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-manager-docker-linux-amd64-${{ github.run_number }}
          path: |
            packages/*.tar.gz
            packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-release:
    name: Publish Docker image tar.gz
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: antigravity-manager-docker-linux-amd64-${{ github.run_number }}
          path: packages
      - name: Publish downloadable release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Antigravity Manager ${{ github.ref_name }} - Docker Linux amd64
          artifacts: packages/*.tar.gz,packages/SHA256SUMS.txt
          artifactErrorsFailBuild: true
          prerelease: true
          makeLatest: false
          body: |
            Linux amd64 Docker image based on official v4.8.4-beta.1 with the custom changes.
            This .tar.gz is created by docker save | gzip and can be imported directly with docker load.

            Download antigravity-manager-${{ github.ref_name }}.tar.gz, then run:
            docker load -i antigravity-manager-${{ github.ref_name }}.tar.gz

            Image name: antigravity-manager:${{ github.ref_name }}
            Binary: /app/antigravity-tools; Web UI: /app/dist; data mount: /root/.antigravity_tools; port: 8045.
            Existing docker run environment variables and the persistent data mount can be retained.
            The workflow checks runtime libraries, container health, Web UI availability and docker load before publishing.
            Identity injection and real upstream model verification remain incomplete.
