name: Build Docker Linux AMD64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine tag name
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="v4.9.8-beta.3-custom"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Building tag: $VER"

      - name: Build Docker image (AMD64)
        uses: docker/build-push-action@v6
        id: docker_build
        continue-on-error: true
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: antigravity-manager:${{ steps.tag.outputs.ver }}
          build-args: |
            USE_MIRROR=false

      - name: Save build log on failure
        if: steps.docker_build.outcome == 'failure'
        run: |
          echo "Docker build failed. Dumping buildx logs..." > build-error.txt
          echo "=== docker buildx du ===" >> build-error.txt
          docker buildx du 2>&1 >> build-error.txt || true
          echo "=== docker system info ===" >> build-error.txt
          docker system info 2>&1 >> build-error.txt || true
          echo "=== Attempting build without cache for full log ===" >> build-error.txt
          docker build --no-cache --progress=plain -f docker/Dockerfile -t test-build . 2>&1 | tail -200 >> build-error.txt || true

      - name: Upload error log
        if: steps.docker_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: build-error.txt
          retention-days: 7

      - name: Fail if build failed
        if: steps.docker_build.outcome == 'failure'
        run: exit 1

      - name: Export image as tar.gz
        if: steps.docker_build.outcome == 'success'
        run: |
          TAG="${{ steps.tag.outputs.ver }}"
          docker save "antigravity-manager:${TAG}" | gzip > "antigravity-manager-${TAG}.tar.gz"
          ls -lh "antigravity-manager-${TAG}.tar.gz"
          sha256sum "antigravity-manager-${TAG}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-manager-docker-linux-amd64
          path: antigravity-manager-*.tar.gz
          retention-days: 30
